services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kasu
      POSTGRES_PASSWORD: kasu
      POSTGRES_DB: kasu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
